<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate Login & Signup | Shilpi Job Consultancy</title><style>
:root{--green:#0B2D45;--gold:#C69A3A;--bg:#FFFAF1;--ink:#142B3D;--muted:#657583}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:520px;margin:48px auto;padding:18px}.brand{text-align:center;margin-bottom:24px}.brand img{display:block;width:150px;height:150px;object-fit:contain;border-radius:10px;margin:0 auto 12px;border:0}.brand a{color:var(--green);font-weight:bold;text-decoration:none}.card{background:white;border:1px solid #E8DFD0;border-radius:18px;padding:28px;box-shadow:0 12px 32px #0B2D4512}.tabs{display:flex;gap:8px;margin-bottom:22px}.tabs button,.submit{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}.tabs button{flex:1;background:#F5EBD8;color:var(--green)}.tabs button.active,.submit{background:var(--green);color:white}label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #DED4C5;border-radius:9px;font-size:15px}.submit{width:100%;margin-top:20px;font-size:15px}.msg{margin-top:16px;padding:12px;border-radius:9px;background:#F5EBD8;color:#0B2D45;display:none;line-height:1.5}.back{text-align:center;margin-top:20px}.back a{color:var(--green)}small{color:var(--muted)}
</style></head><body><main class="wrap"><div class="brand"><a href="/"><img src="/shilpi-logo.webp" alt="Shilpi Agarwal Job Consultant logo">SHILPI AGARWAL JOB CONSULTANT</a><p>Candidate Account</p></div><section class="card"><div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create Account</button></div><form id="authForm"><div id="nameWrap" style="display:none"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your full name"></div><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"><button class="submit" id="submitBtn" type="submit">Login</button></form><div class="msg" id="message" role="status"></div><button id="resendBtn" type="button" class="submit" style="display:none;background:#C69A3A;margin-top:10px">Resend verification email</button><p class="back"><a href="/">← Back to website</a></p><small>Candidate accounts are for job enquiries. They do not provide Admin or blog publishing access.</small></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>
const cfg=window.SHILPI_SUPABASE_CONFIG;const msg=document.getElementById('message');const resendBtn=document.getElementById('resendBtn');let mode='login';let client=null;let lastSignupEmail='';if(cfg&&window.supabase)client=window.supabase.createClient(cfg.url,cfg.anonKey);
function showMessage(text,showResend=false){msg.textContent=text;msg.style.display='block';resendBtn.style.display=showResend?'block':'none';}
function setMode(m){mode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('nameWrap').style.display=m==='signup'?'block':'none';document.getElementById('fullName').required=m==='signup';document.getElementById('submitBtn').textContent=m==='signup'?'Create Candidate Account':'Login';msg.style.display='none';resendBtn.style.display='none';}
document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('signupTab').onclick=()=>setMode('signup');
// Supabase redirects verified candidates back to this page. A successful confirmation
// normally establishes a session; the login form remains available afterwards.
(async()=>{if(!client)return;const {data:{session}}=await client.auth.getSession();if(session){showMessage('Email verified successfully. Your candidate account is ready. You can now log in.');}else if(location.hash.includes('error_description=')){const params=new URLSearchParams(location.hash.slice(1));showMessage('Email verification could not be completed: '+(params.get('error_description')||'Please request a new link.'));}})();
document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();showMessage('Please wait…');if(!client){showMessage('Supabase configuration is missing. Please contact the website administrator.');return}const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;try{let result;if(mode==='signup'){const fullName=document.getElementById('fullName').value.trim();lastSignupEmail=email;result=await client.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:location.origin+'/candidate-auth.html'}});if(result.error)throw result.error;showMessage(result.data.session?'Account created and verified. You can now log in.':'Account created. A verification link has been requested for '+email+'. Please check Inbox and Spam. If it does not arrive, use Resend verification email below.',!result.data.session);}else{result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;showMessage('Login successful. Your candidate account is active. You can now return to the website and contact the consultancy about jobs.');}}catch(err){showMessage(err.message||'Something went wrong. Please try again.');}});
resendBtn.addEventListener('click',async()=>{const email=(lastSignupEmail||document.getElementById('email').value).trim();if(!email){showMessage('Please enter your email address first.');return;}resendBtn.disabled=true;try{const {error}=await client.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+'/candidate-auth.html'}});if(error)throw error;showMessage('A new verification email has been requested for '+email+'. Check Inbox and Spam.');}catch(err){showMessage(err.message||'Could not resend the email. Please try later.',true);}finally{resendBtn.disabled=false;}});
</script></body></html>
