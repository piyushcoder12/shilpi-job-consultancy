<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate Login & Signup | Shilpi Job Consultancy</title><style>
:root{--green:#173F35;--gold:#E8B65A;--bg:#F7F5EF;--ink:#172821;--muted:#64736C}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:520px;margin:48px auto;padding:18px}.brand{text-align:center;margin-bottom:24px}.brand img{display:block;width:150px;height:150px;object-fit:contain;border-radius:10px;margin:0 auto 12px;border:0}.brand a{color:var(--green);font-weight:bold;text-decoration:none}.card{background:white;border:1px solid #DFE5DC;border-radius:18px;padding:28px;box-shadow:0 12px 32px #173F3512}.tabs{display:flex;gap:8px;margin-bottom:22px}.tabs button,.submit{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}.tabs button{flex:1;background:#F5EBD8;color:var(--green)}.tabs button.active,.submit{background:var(--green);color:white}label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #D9E0D8;border-radius:9px;font-size:15px}.submit{width:100%;margin-top:20px;font-size:15px}.msg{margin-top:16px;padding:12px;border-radius:9px;background:#F5EBD8;color:#173F35;display:none;line-height:1.5}.back{text-align:center;margin-top:20px}.back a{color:var(--green)}small{color:var(--muted)}
</style><style>/* refined logo theme */
:root{--site-primary:#173F35!important;--site-on-primary:#fff!important;--site-secondary:#E8B65A!important;--site-on-secondary:#173F35!important;--site-background:#F7F5EF!important;--site-on-background:#24384B!important;--muted:#687786!important;--line:#E9E1D5!important;--surface:#fff!important;--mint:#F4EEE3!important}
body{background:#F7F5EF!important;color:#24384B!important}
#app{background:#F7F5EF!important;color:#24384B!important}
.topbar{background:#173F35!important;color:#fff!important}
header{background:rgba(255,255,255,.97)!important;box-shadow:0 3px 18px rgba(16,44,70,.06)!important;border-bottom:1px solid #eee6da!important}
.nav{min-height:84px!important}.logo{width:76px!important;height:76px!important;object-fit:contain!important;background:transparent!important;border:0!important;box-shadow:none!important}
.brand{color:#173F35!important}.brand small{color:#8A7555!important}
.links a{color:#34495C!important}.links a:hover{color:#B1843D!important}
.btn.primary,.primary{background:#173F35!important;color:#fff!important}.btn.gold,.gold{background:#E8B65A!important;color:#173F35!important}
.hero{background:linear-gradient(115deg,#F7F5EF 0%,#F7F0E5 100%)!important;padding-top:64px!important}
.hero h1,.section h2{color:#173F35!important}.hero h1 em{color:#B1843D!important}
.eyebrow{background:#F0E7D8!important;color:#173F35!important}
.art-card{background:linear-gradient(145deg,#163B59,#173F35)!important;box-shadow:0 18px 44px rgba(16,44,70,.13)!important;border:1px solid rgba(195,154,82,.45)!important}
.trustbar{background:#F0E8DC!important;color:#173F35!important}.trust-item small{color:#687786!important}
.section{background:#F7F5EF!important}.services .service,.review,.video-card,.blog-card,.form{background:#fff!important;border-color:#E9E1D5!important;box-shadow:0 8px 26px rgba(16,44,70,.045)!important}
.service:hover{border-color:#E8B65A!important}.service-icon,.avatar{background:#F2E9DA!important;color:#173F35!important}
.process{background:#173F35!important}.process .step{border-color:rgba(255,255,255,.22)!important}.process .step-num,.process .kicker{color:#D8B779!important}
.reviews{background:#F4EFE7!important}.review blockquote{color:#42576A!important}

.blog-card{border-radius:18px!important;overflow:hidden!important}.blog-read{background:#E8B65A!important;color:#173F35!important;border-radius:8px!important}

footer{background:#173F35!important;color:#fff!important}footer a:hover{color:#D8B779!important}

@media(max-width:700px){.logo{width:64px!important;height:64px!important}.nav{min-height:70px!important}.hero{padding-top:42px!important}}
</style>
</head><body><main class="wrap"><div class="brand"><a href="/"><img src="/shilpi-logo.webp" alt="Shilpi Agarwal Job Consultant logo">SHILPI AGARWAL JOB CONSULTANT</a><p>Candidate Account</p></div><section class="card"><div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create Account</button></div><form id="authForm"><div id="nameWrap" style="display:none"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your full name"></div><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"><button class="submit" id="submitBtn" type="submit">Login</button></form><div class="msg" id="message" role="status"></div><p class="back"><a href="/">← Back to website</a></p><small>Candidate accounts are for job enquiries. They do not provide Admin or blog publishing access.</small></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>
const cfg=window.SHILPI_SUPABASE_CONFIG;const msg=document.getElementById('message');let mode='login';let client=null;if(cfg&&window.supabase)client=window.supabase.createClient(cfg.url,cfg.anonKey);
function setMode(m){mode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('nameWrap').style.display=m==='signup'?'block':'none';document.getElementById('fullName').required=m==='signup';document.getElementById('submitBtn').textContent=m==='signup'?'Create Candidate Account':'Login';msg.style.display='none'}
document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('signupTab').onclick=()=>setMode('signup');
document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();msg.style.display='block';if(!client){msg.textContent='Supabase configuration is missing. Please contact the website administrator.';return}const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;try{let result;if(mode==='signup'){const fullName=document.getElementById('fullName').value.trim();result=await client.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:location.origin+'/candidate-auth.html'}});if(result.error)throw result.error;msg.textContent=result.data.session?'Account created. You can now log in.':'Account created. Please check your email for the confirmation link, then return here to log in.';}else{result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;msg.textContent='Login successful. Your candidate account is active. You can now return to the website and contact the consultancy about jobs.';}}catch(err){msg.textContent=err.message||'Something went wrong. Please try again.';}});
</script></body></html>
